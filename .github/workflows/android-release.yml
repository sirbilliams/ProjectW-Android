name: Build and publish Android prototype

on:
  push:
    branches: [main]
    paths:
      - "**.gd"
      - "**.tscn"
      - "project.godot"
      - "export_presets.cfg"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:

concurrency:
  group: projectw-android-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      GODOT_VERSION: "4.4.1"
      GODOT_ANDROID_KEYSTORE_DEBUG_PATH: "${{ github.workspace }}/debug.keystore"
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      RELEASE_TAG: v0.1.0-alpha.1
      APK_PATH: build/ProjectW-Dustfall-v0.1.0-alpha.apk
    steps:
      - uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK with available packages
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Install Godot editor and export templates
        run: |
          set -euxo pipefail
          mkdir -p /tmp/godot ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot/editor.zip
          unzip -q /tmp/godot/editor.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          echo "/tmp/godot" >> "$GITHUB_PATH"
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/godot/templates.tpz
          unzip -q /tmp/godot/templates.tpz -d /tmp/godot/templates
          cp /tmp/godot/templates/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Make temporary debug signing key
        run: |
          keytool -genkeypair -noprompt -keystore "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH" -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 3650 -storepass android -keypass android -dname "CN=Android Debug,O=ProjectW,C=US"
          mkdir -p build

      - name: Validate Godot project import
        run: |
          /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path . --editor --import --quit

      - name: Set Godot Android SDK paths
        run: |
          timeout 40s /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path . --editor --quit-after 1 --script res://tools/configure_android.gd

      - name: Export Android APK
        run: |
          /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path . --export-debug Android "$APK_PATH"
          test -s "$APK_PATH"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectW-Dustfall-Android-debug-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: Publish prerelease with APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          # Dustfall — first Android prototype
          Early **debug-signed** build for AYN Thor MAX testing.

          Includes a simple wake-up intro, first-person controls, salvaged settlement blockout, scrap pickups and HUD.

          **Prototype only:** Not playtested on device; chunk streaming and bottom-screen Pip-Boy are not yet implemented.

          If you installed another build signed by a different debug key, uninstall that one first.
          EOF
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK_PATH" --clobber
          else
            gh release create "$RELEASE_TAG" "$APK_PATH" --target "$GITHUB_SHA" --title "Dustfall v0.1.0 Alpha 1 (Android)" --notes-file /tmp/release-notes.md --prerelease
          fi
